name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref so a new push does not wait
# behind an old matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect whether this change needs the Go jobs. Docs-only PRs skip
  # lint/build/test/distro so they still report the required check names
  # as skipped (treated as passing). Workflow and Go-source edits keep
  # the full matrix.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 + picomatch CVE fix
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'makefile'
              - 'Makefile'
              - 'testdata/**'
              - 'test/envs/**'
              - '.golangci.yml'
              - '.github/workflows/**'
              - 'scripts/**'

  # Static analysis. golangci-lint version is pinned in the makefile.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint

  # Statement coverage floors for store/cmd (issue #234). Ubuntu-only;
  # the packages are mostly OS-agnostic at this layer and the script uses
  # an empty HOME so it never touches a real system store.
  coverage:
    name: coverage-floor
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Enforce store/cmd coverage floors
        run: make coverage-floor

  # Compile every GOOS/GOARCH we ship. Add a pair here to cover a new
  # target without waiting on a hosted runner for that OS. The six
  # targets compile in parallel.
  build:
    name: cross-compile
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p bin
          targets='
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          '
          pids=()
          for spec in $targets; do
            goos=${spec%/*}
            goarch=${spec#*/}
            out="bin/trustprune-${goos}-${goarch}"
            if [ "$goos" = windows ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -o "$out" . &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit "$status"

  # One linux/amd64 binary for all distro jobs. Distro tests look for
  # bin/trustprune-linux-amd64; building it once avoids repeating compile
  # in every matrix row.
  build-linux:
    name: build-linux
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Build linux binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/trustprune-linux-amd64 .
          chmod +x bin/trustprune-linux-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trustprune-linux-amd64
          path: bin/trustprune-linux-amd64
          if-no-files-found: error
          retention-days: 1

  # Native tests. Add a runner OS to expand platform coverage.
  # CGO=0 matches the shipped static binary. Extra rows cover Darwin
  # cgo roots (Security.framework) and the race detector. ubuntu-24.04-arm
  # and windows-11-arm cover free GitHub-hosted arm64 (issue #302).
  # go vet runs on cgo=0 rows only (once per OS); cgo=1 and race rows skip it.
  test:
    name: test (${{ matrix.os }}, cgo=${{ matrix.cgo }})
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-26, windows-latest, windows-11-arm]
        cgo: ["0"]
        race: [false]
        include:
          - os: macos-15
            cgo: "1"
            race: false
          - os: macos-26
            cgo: "1"
            race: false
          - os: ubuntu-latest
            cgo: "1"
            race: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Vet
        if: matrix.cgo == '0'
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go vet ./...
      - name: Unit tests
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          extra=()
          if [ "${{ matrix.race }}" = "true" ]; then
            extra+=(-race)
          fi
          go test -count=1 -timeout 3m "${extra[@]}" ./pkg/... .
      - name: Build native binary
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p bin
          arch=$(go env GOARCH)
          case "$(go env GOOS)" in
            linux)   out="bin/trustprune-linux-${arch}" ;;
            darwin)  out="bin/trustprune-osx-${arch}" ;;
            windows) out="bin/trustprune-${arch}.exe" ;;
          esac
          go build -trimpath -o "$out" .
      - name: CLI integration
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          extra=()
          timeout=3m
          if [ "${{ matrix.race }}" = "true" ]; then
            extra+=(-race)
            timeout=5m
          fi
          go test -count=1 -timeout "$timeout" "${extra[@]}" ./test/ -skip 'TestAlpine|TestDebian|TestUbuntu|TestRocky|TestFedora|TestArch|TestGentoo|TestDocker|TestFirefox|TestChrome'

  # Linux distro coverage via Docker. Add a suite name + Dockerfile under
  # test/envs/ to expand. Suites run in parallel so a slow image pull does
  # not block the others. Short suites share a job (docker-smoke+gentoo,
  # browsers) so each Test* still runs once with fewer runners.
  distro:
    name: distro (${{ matrix.name }})
    needs: [changes, build-linux]
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine
            run: TestAlpine
          - name: debian
            run: TestDebian
          - name: ubuntu
            run: TestUbuntu
          - name: rocky
            run: TestRocky
          - name: fedora
            run: TestFedora
          - name: arch
            run: TestArch
          - name: docker-smoke+gentoo
            run: 'TestDocker|TestGentoo'
          - name: browsers
            run: 'TestFirefox|TestChrome'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: trustprune-linux-amd64
          path: bin
      - name: Make linux binary executable
        run: chmod +x bin/trustprune-linux-amd64
      - name: Distro tests
        run: go test -count=1 -timeout 15m ./test/ -run '${{ matrix.run }}'

  # FreeBSD via QEMU (vmactions/freebsd-vm). Installs the same Go version as
  # go.mod into the guest and runs unit + CLI tests under an empty HOME so
  # nothing touches the guest system trust store.
  freebsd:
    name: freebsd
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          copyback: false
          prepare: |
            set -e
            pkg install -y curl ca_root_nss
            gover=$(awk '/^go /{print $2}' go.mod)
            curl -fsSL "https://go.dev/dl/go${gover}.freebsd-amd64.tar.gz" | tar -C /usr/local -xzf -
          run: |
            set -e
            export PATH=/usr/local/go/bin:$PATH
            empty_home=$(mktemp -d)
            export HOME="$empty_home"
            export USERPROFILE="$empty_home"
            echo "FreeBSD $(freebsd-version) $(uname -m); Go $(go version); HOME=$HOME"
            go vet ./...
            CGO_ENABLED=0 go test -count=1 -timeout 5m ./pkg/... .
            mkdir -p bin
            CGO_ENABLED=0 go build -trimpath -o "bin/trustprune-freebsd-$(go env GOARCH)" .
            go test -count=1 -timeout 5m ./test/ -skip 'TestAlpine|TestDebian|TestUbuntu|TestRocky|TestFedora|TestArch|TestGentoo|TestDocker|TestFirefox|TestChrome'
