name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref so a new push does not wait
# behind an old matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect whether this change needs the Go jobs. Docs-only PRs skip
  # lint/build/test/distro so they still report the required check names
  # as skipped (treated as passing). Workflow and Go-source edits keep
  # the full matrix.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 + picomatch CVE fix
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'makefile'
              - 'Makefile'
              - 'testdata/**'
              - 'test/envs/**'
              - '.golangci.yml'
              - '.github/workflows/**'
              - 'scripts/**'

  # Static analysis. golangci-lint version is pinned in the makefile.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Lint
        run: make lint

  # Compile every GOOS/GOARCH we ship. Add a pair here to cover a new
  # target without waiting on a hosted runner for that OS.
  build:
    name: cross-compile
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p bin
          targets='
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          '
          for spec in $targets; do
            export GOOS=${spec%/*} GOARCH=${spec#*/} CGO_ENABLED=0
            out="bin/trustprune-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            go build -trimpath -o "$out" .
          done

  # Native tests. Add a runner OS to expand platform coverage.
  # CGO=0 matches the shipped static binary. Extra rows cover Darwin
  # cgo roots (Security.framework) and the race detector.
  test:
    name: test (${{ matrix.os }}, cgo=${{ matrix.cgo }})
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-26, windows-latest]
        cgo: ["0"]
        race: [false]
        include:
          - os: macos-15
            cgo: "1"
            race: false
          - os: macos-26
            cgo: "1"
            race: false
          - os: ubuntu-latest
            cgo: "1"
            race: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Vet and unit tests
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go vet ./...
          extra=()
          if [ "${{ matrix.race }}" = "true" ]; then
            extra+=(-race)
          fi
          go test -count=1 -timeout 3m "${extra[@]}" ./pkg/... .
      - name: Build native binary
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p bin
          arch=$(go env GOARCH)
          case "$(go env GOOS)" in
            linux)   out="bin/trustprune-linux-${arch}" ;;
            darwin)  out="bin/trustprune-osx-${arch}" ;;
            windows) out="bin/trustprune-${arch}.exe" ;;
          esac
          go build -trimpath -o "$out" .
      - name: CLI integration
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          extra=()
          timeout=3m
          if [ "${{ matrix.race }}" = "true" ]; then
            extra+=(-race)
            timeout=5m
          fi
          go test -count=1 -timeout "$timeout" "${extra[@]}" ./test/ -skip 'TestAlpine|TestDebian|TestUbuntu|TestDocker'

  # Linux distro coverage via Docker. Add a suite name + Dockerfile under
  # test/envs/ to expand. Suites run in parallel so a slow image pull does
  # not block the others.
  distro:
    name: distro (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine
            run: TestAlpine
          - name: debian
            run: TestDebian
          - name: ubuntu
            run: TestUbuntu
          - name: docker-smoke
            run: TestDocker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Build linux binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o "bin/trustprune-linux-$(go env GOARCH)" .
          chmod +x "bin/trustprune-linux-$(go env GOARCH)"
      - name: Distro tests
        run: go test -count=1 -timeout 15m ./test/ -run ${{ matrix.run }}
